name: Android tests

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

  android-instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android Keystore and recovery tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto
          script: |
            mkdir -p android/app/build/diagnostics
            adb shell pm list instrumentation > android/app/build/diagnostics/installed-instrumentation.txt
            adb logcat -c

            gradle --no-daemon -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=it.superiaprivata.app.chat.ProcessRestartRecoveryInstrumentedTest || { test_status=$?; adb logcat -d -v threadtime > android/app/build/diagnostics/instrumentation-logcat.txt; adb shell dumpsys activity instrumentation > android/app/build/diagnostics/instrumentation-state.txt || true; exit "$test_status"; }
            gradle --no-daemon -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=it.superiaprivata.app.chat.ProcessRestartRecoveryInstrumentedTest#writePendingStateForProcessRestart || { test_status=$?; adb logcat -d -v threadtime > android/app/build/diagnostics/instrumentation-logcat.txt; adb shell dumpsys activity instrumentation > android/app/build/diagnostics/instrumentation-state.txt || true; exit "$test_status"; }
            adb shell am force-stop it.superiaprivata.app
            if adb shell pidof it.superiaprivata.app | grep -q '[0-9]'; then
              echo "Il processo applicativo risulta ancora attivo dopo force-stop"
              exit 1
            fi
            gradle --no-daemon -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=it.superiaprivata.app.chat.ProcessRestartRecoveryInstrumentedTest#verifyPendingStateAfterProcessRestart || { test_status=$?; adb logcat -d -v threadtime > android/app/build/diagnostics/instrumentation-logcat.txt; adb shell dumpsys activity instrumentation > android/app/build/diagnostics/instrumentation-state.txt || true; exit "$test_status"; }
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/diagnostics/
          if-no-files-found: warn
          retention-days: 7


  android-physical-device-test-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build temporary debug APKs for authorized physical-device validation
        run: gradle --no-daemon -p android assembleDebug assembleDebugAndroidTest
      - name: Upload temporary physical-device test APKs
        uses: actions/upload-artifact@v4
        with:
          name: superia-physical-device-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3
