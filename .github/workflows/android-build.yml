name: Android fast checks

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      run_instrumented:
        description: "Esegui la lunga suite strumentale su emulatore (solo quando autorizzata)"
        required: false
        default: false
        type: boolean

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

  android-instrumented-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_instrumented
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android Keystore and recovery tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel auto
          script: |
            mkdir -p android/app/build/diagnostics
            adb shell pm list instrumentation > android/app/build/diagnostics/installed-instrumentation.txt
            adb logcat -c

            gradle --no-daemon -p android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=it.superiaprivata.app.chat.ProcessRestartRecoveryInstrumentedTest || { test_status=$?; adb logcat -d -v threadtime > android/app/build/diagnostics/instrumentation-logcat.txt; adb shell dumpsys activity instrumentation > android/app/build/diagnostics/instrumentation-state.txt || true; exit "$test_status"; }
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm list instrumentation > android/app/build/diagnostics/installed-instrumentation-after-install.txt
            adb shell pm list packages > android/app/build/diagnostics/installed-packages-after-install.txt
            cat android/app/build/diagnostics/installed-instrumentation-after-install.txt
            grep -F 'it.superiaprivata.app.test/androidx.test.runner.AndroidJUnitRunner' android/app/build/diagnostics/installed-instrumentation-after-install.txt
            adb shell am instrument -w -e class it.superiaprivata.app.chat.ProcessRestartRecoveryInstrumentedTest#writePendingStateForProcessRestart it.superiaprivata.app.test/androidx.test.runner.AndroidJUnitRunner > android/app/build/diagnostics/process-restart-write.txt 2>&1; status=$?; cat android/app/build/diagnostics/process-restart-write.txt; test "$status" -eq 0 && grep -q "OK (1 test)" android/app/build/diagnostics/process-restart-write.txt && ! grep -q "FAILURES!!!" android/app/build/diagnostics/process-restart-write.txt || { adb logcat -d -v threadtime > android/app/build/diagnostics/instrumentation-logcat.txt; adb shell dumpsys activity instrumentation > android/app/build/diagnostics/instrumentation-state.txt || true; exit 1; }
            adb shell am force-stop it.superiaprivata.app
            adb shell am instrument -w -e class it.superiaprivata.app.chat.ProcessRestartRecoveryInstrumentedTest#verifyPendingStateAfterProcessRestart it.superiaprivata.app.test/androidx.test.runner.AndroidJUnitRunner > android/app/build/diagnostics/process-restart-verification.txt 2>&1; status=$?; cat android/app/build/diagnostics/process-restart-verification.txt; test "$status" -eq 0 && grep -q "OK (1 test)" android/app/build/diagnostics/process-restart-verification.txt && ! grep -q "FAILURES!!!" android/app/build/diagnostics/process-restart-verification.txt || { adb logcat -d -v threadtime > android/app/build/diagnostics/instrumentation-logcat.txt; adb shell dumpsys activity instrumentation > android/app/build/diagnostics/instrumentation-state.txt || true; exit 1; }
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/diagnostics/
          if-no-files-found: warn
          retention-days: 7
