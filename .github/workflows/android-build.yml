name: Android debug build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SUPERIA_KEYSTORE_BASE64: ${{ secrets.SUPERIA_KEYSTORE_BASE64 }}
      SUPERIA_KEYSTORE_PASSWORD: ${{ secrets.SUPERIA_KEYSTORE_PASSWORD }}
      SUPERIA_KEY_ALIAS: ${{ secrets.SUPERIA_KEY_ALIAS }}
      SUPERIA_KEY_PASSWORD: ${{ secrets.SUPERIA_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare persistent Android signing key
        if: env.SUPERIA_KEYSTORE_BASE64 != ''
        run: |
          echo "SUPERIA_KEYSTORE_FILE=$RUNNER_TEMP/superia-upload.jks" >> "$GITHUB_ENV"
          printf '%s' "$SUPERIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/superia-upload.jks"
          test -s "$RUNNER_TEMP/superia-upload.jks"
          chmod 600 "$RUNNER_TEMP/superia-upload.jks"
      - name: Report missing persistent signing configuration
        if: env.SUPERIA_KEYSTORE_BASE64 == ''
        run: echo "::warning::Stable signing secrets are not configured. No installable release APK will be uploaded."
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK for emulator tests
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Assemble stable signed APK
        if: env.SUPERIA_KEYSTORE_BASE64 != ''
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Upload stable signed APK
        if: env.SUPERIA_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: superia-privata-installable
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            for attempt in $(seq 1 60); do if adb wait-for-device && adb shell '[ "$(getprop sys.boot_completed)" = "1" ]'; then break; fi; sleep 5; done; adb shell '[ "$(getprop sys.boot_completed)" = "1" ]' && sleep 10 && cd android && gradle --no-daemon connectedDebugAndroidTest
