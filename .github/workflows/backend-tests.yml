name: Backend tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superia
          POSTGRES_PASSWORD: superia-test
          POSTGRES_DB: superia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superia -d superia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPERIA_TEST_POSTGRES_URL: postgresql://superia:superia-test@localhost:5432/superia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/api/requirements-dev.txt
      - run: PYTHONPATH=services/api pytest -q services/api/tests
